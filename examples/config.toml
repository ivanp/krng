# krng global configuration
# Location: ~/.config/krng/config.toml  (or $XDG_CONFIG_HOME/krng/config.toml)
#
# Settings here apply to every krng invocation.
# Per-project overrides go in krng.toml at the project root.
# All lists are merged additively — project entries are appended to global entries.
#
# SECURITY NOTE: krng.toml in a project directory you did not write can change
# sandbox behavior. Review krng.toml before running krng in an untrusted
# repository, just as you would review a Makefile or package.json.

# Environment variables to pass through into the sandbox.
# passenv = [
#   "ANTHROPIC_API_KEY",
#   "GH_TOKEN",
#   "OPENAI_API_KEY",
#   "DOCKER_HOST",
# ]

# Read-only bind mounts. The path is used as both the host and container path.
# Supports ~ expansion.
# ro_bind = [
#   "~/.config/gh",          # GitHub CLI config
#   "~/.config/op",          # 1Password CLI config
#   "~/.config/rclone",      # rclone config
# ]

# Read-write bind mounts.
# bind = [
#   "/var/run/docker.sock",  # Docker daemon socket
# ]

# Disable --new-session (re-enables Ctrl+Z / fg job control; reduces terminal security).
# new_session = false

# Share host /tmp inside the sandbox (exposes X11/Wayland sockets; off by default).
# share_tmp = true

# Enable Docker support: mounts /sys read-only, shares cgroup namespace,
# and auto-binds the Docker socket (/run/docker.sock).
# docker = true
